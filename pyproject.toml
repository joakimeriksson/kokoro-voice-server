[project]
name = "kokoro-voice-server"
version = "0.2.0"
description = "Standalone OpenAI-compatible voice server: Kokoro TTS (incl. fine-tuned Swedish voices) + Whisper STT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "soundfile>=0.12",
    "numpy",
    "scipy",  # notch filters that remove the fine-tune upsampler tones (Swedish path)
    "onnxruntime>=1.20",
    "huggingface-hub>=1.5",
    "kokoro",
    "torch",
    "misaki",
    "phonemizer-fork",
    "espeakng-loader",
    "lingua-language-detector",
    "faster-whisper",   # /v1/audio/transcriptions (Whisper STT, CPU int8)
    "python-multipart",  # FastAPI Form/File for the transcription endpoint
    # Swedish neural g2p (vendored inside the kokoro-sv package) — makes the
    # kokoro-svml engine work without a swedish-kokoro checkout on disk.
    "kokoro-sv",
    # spaCy model misaki's English g2p loads (it would otherwise try to pip-download
    # it at runtime, which fails inside a uv-managed venv). Declared here so
    # `uv sync` installs it and never removes it as "unmanaged".
    "en-core-web-sm",
    "speechbrain>=1.1.1",
]

[project.urls]
Homepage = "https://github.com/joakimeriksson/kokoro-voice-server"
Voices = "https://huggingface.co/Joakim/kokoro-sv-voices"

[tool.uv.sources]
kokoro-sv = { git = "https://github.com/joakimeriksson/kokoro-sv" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

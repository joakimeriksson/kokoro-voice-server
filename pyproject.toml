[project]
name = "reachy-voice-server"
version = "0.1.0"
description = "Standalone OpenAI-compatible voice server (Kokoro engines) for reachy_local_assistant"
requires-python = ">=3.11,<3.13"
# Its OWN environment so the Kokoro/transformers stack (needs huggingface-hub>=1.5)
# doesn't collide with the app's pinned huggingface-hub==1.3.0. Runs the repo's
# self-contained scripts/voice_server.py (kokoro / kokoro-sv / kokoro-svml engines).
dependencies = [
    "fastapi",
    "uvicorn",
    "soundfile>=0.12",
    "numpy",
    "scipy",  # notch filters that remove the fine-tune upsampler tones (Swedish path)
    "onnxruntime>=1.20",
    "huggingface-hub>=1.5",
    "kokoro",
    "torch",
    "misaki",
    "phonemizer-fork",
    "espeakng-loader",
    "lingua-language-detector",
    "faster-whisper",   # /v1/audio/transcriptions (Whisper STT, CPU int8)
    "python-multipart",  # FastAPI Form/File for the transcription endpoint
]
